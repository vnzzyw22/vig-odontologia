<!-- linha de encontro dos dois perfis -->
<path fill="none" stroke="#9C7234" stroke-width="3.2" stroke-linecap="round" d="M156,16 C172,70 170,200 164,304"/>

<!-- implante: ombro, corpo rosqueado e ponta -->
<g transform="translate(150 0) scale(1.3 1) translate(-150 0)">
<path fill="url(#vg-implante)" d="M116,290 C116,284 126,280 150,280 C174,280 184,284 184,290 L178,300 L172,388 C172,394 162,398 150,398 C138,398 128,394 128,388 L122,300 Z"/>
<g fill="none" stroke="#8F6428" stroke-width="2.6" stroke-linecap="round" opacity="0.85">
  <path d="M121,312 Q150,320 179,312"/>
  <path d="M123,326 Q150,334 177,326"/>
  <path d="M124,340 Q150,348 176,340"/>
  <path d="M125,354 Q150,362 175,354"/>
  <path d="M127,368 Q150,375 173,368"/>
  <path d="M129,381 Q150,388 171,381"/>
