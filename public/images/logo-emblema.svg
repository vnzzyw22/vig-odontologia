<path fill="none" stroke="#FFF6E2" stroke-width="2" stroke-linecap="round" opacity="0.7" d="M133,296 L137,386"/>

</g>

<!-- base oval -->
<path fill="url(#vg-base)" d="M10,404 C10,396 60,392 150,392 C240,392 290,396 290,404 C290,412 240,418 150,418 C60,418 10,412 10,404 Z"/>
<path fill="none" stroke="#FFF1D4" stroke-width="1.6" opacity="0.8" d="M26,400 C70,396 230,396 274,400"/>
