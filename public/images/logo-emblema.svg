  </linearGradient>
  <linearGradient id="vg-implante" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#B58B4A"/><stop offset="0.35" stop-color="#EBD3A2"/><stop offset="0.7" stop-color="#D3AF6E"/><stop offset="1" stop-color="#A57A3A"/>
  </linearGradient>
  <linearGradient id="vg-base" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#EBD6B0"/><stop offset="1" stop-color="#B58B4A"/>
  </linearGradient>
</defs>

<!-- perfil de trás (direita), com a crista de cabelo em chama -->
