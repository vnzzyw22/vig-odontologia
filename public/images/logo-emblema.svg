<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="VIG Odontologia">
<defs>
  <linearGradient id="vg-rosto-a" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FBF3E4"/><stop offset="0.55" stop-color="#EBD6B0"/><stop offset="1" stop-color="#D4B37E"/>
  </linearGradient>
  <linearGradient id="vg-rosto-b" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F3E3C4"/><stop offset="1" stop-color="#D2B07A"/>
  </linearGradient>
  <linearGradient id="vg-cabelo" x1="0" y1="0" x2="1" y2="1">
